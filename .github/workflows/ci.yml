name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  # ghcr.io requires lowercase image paths (github.repository is "UberMetroid/thrall")
  IMAGE: ghcr.io/ubermetroid/thrall
  IMAGE_PEER: ghcr.io/ubermetroid/thrall-syncthing

jobs:
  verify:
    name: Verification Ladder (test, clippy, fmt, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 1. cargo test
        run: cargo test --workspace --all-targets

      - name: 2. cargo clippy (zero-panic invariant)
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: 3. cargo fmt --check
        run: cargo fmt --all -- --check

      - name: 4. cargo build --release
        run: cargo build --release --workspace

  containers:
    name: Fedora-minimal OCI images (amd64 + arm64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/metadata-action@v5
        id: meta-peer
        with:
          images: ${{ env.IMAGE_PEER }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push thrall (control plane)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=thrall
          cache-to: type=gha,scope=thrall,mode=max

      - name: Build & push thrall-syncthing (peer node)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.syncthing
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-peer.outputs.tags }}
          labels: ${{ steps.meta-peer.outputs.labels }}
          cache-from: type=gha,scope=peer
          cache-to: type=gha,scope=peer,mode=max
