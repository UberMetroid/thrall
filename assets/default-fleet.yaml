# THRALL — Declarative Fleet Configuration
# Environment variable overrides:
#   PORTAL_LISTEN_ADDR, PORTAL_DATABASE_PATH, PORTAL_SESSION_SECRET
#   LDAP_URL, LDAP_BASE_DN, LDAP_BIND_DN, LDAP_BIND_PASSWORD, LDAP_USER_FILTER, ADMIN_USERS

portal:
  listen_addr: "0.0.0.0:8080"
  database_path: "/config/mesh-mgr.db"
  # Leave empty: the daemon generates a random secret and persists it here on first
  # boot. The daemon refuses to start while this still holds the shipped placeholder.
  session_secret: ""

ldap:
  url: "ldap://ldap.example.com:389"
  base_dn: "dc=example,dc=com"
  bind_dn: "cn=admin,dc=example,dc=com"
  bind_password: ""
  user_filter: "(&(objectClass=person)(uid=%s))"
  admin_users: ["admin"]

servers:
  # Every peer is reached over its own REST API, authenticated with that
  # peer's API key. THRALL opens no SSH connection and needs no SSH access to
  # any machine. A peer that shares the host with the daemon is marked
  # `local: true` and is reached over the loopback interface; every other peer
  # must publish its API on a reachable address, such as the host's address on
  # a private overlay network.
  #
  # The API key is the credential that authenticates THRALL against the peer.
  # Read it once from the peer's own configuration and keep this file private.
  - name: "us-west"
    local: false
    syncthing_api_url: "http://100.64.0.10:8384"
    syncthing_api_key: ""
    syncthing_wan_addr: "tcp://100.64.0.10:22000"
  - name: "us-east"
    local: false
    syncthing_api_url: "http://100.64.0.20:8384"
    syncthing_api_key: ""
    syncthing_wan_addr: "tcp://100.64.0.20:22000"
